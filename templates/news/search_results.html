{% extends 'news/base.html' %}
{% load static %}

{% block content %}

<div>
  <h1>Qidiruvni resultati</h1>

  {% for data in all_data %}

  <h3><a href="{% url 'news_detail_page' data.slug %}" class="text-danger">{{data.title}}</a> </h3>
  <p><img src="{{data.image.url}}" width="30%"></p>
<h4>{{data.body | truncatewords:10}}</h4>

  {% endfor %}

</div>

{% endblock content %}
