{% extends 'news/base.html' %}
{% load static %}
{% block title %} Login sahifasi {% endblock title %}
{% block content %}

<h2>Hooray</h2>
<div style="width: 600px; height: 400px; margin-left: 50px">
    <video loop playsinline id="myVideo"  style=" width: 600px; height: 400px; object-fit:cover; position: relative !important;">
    <source src="{% static 'images/mambo.mp4' %}" type="video/mp4">
    Your browser does not support HTML5 video.
</video>
</div>


<a href="{% url 'login_page_view' %}">Qayta login</a>
<!-- Затемнение фона -->
<div id="popupOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:998;"></div>

<!-- Сам попап -->
<div id="popupBox" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:30px 40px; border-radius:10px; text-align:center; z-index:999; box-shadow:0 5px 20px rgba(0,0,0,0.3);">
    <p style="margin-bottom:20px; font-size:18px;">Вы подтверждаете изменение</p>
    <button id="confirmBtn" style="padding:10px 25px; font-size:16px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:5px;">Да, согласен</button>
</div>

<script>
document.getElementById('confirmBtn').addEventListener('click', function () {
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('popupOverlay');
    const popup = document.getElementById('popupBox');

    video.muted = false;
    video.play().catch(function (err) {
        console.log('Не удалось включить звук:', err);
    });

    overlay.remove();
    popup.remove();
});
</script>

{% endblock content %}
